# Source: icegres/templates/icegresd-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: icegres
  namespace: icegres-system
  labels:
    helm.sh/chart: icegres-0.1.0
    app.kubernetes.io/name: icegres
    app.kubernetes.io/instance: icegres
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: icegresd
spec:
  # ha.enabled: at least two instances; the leader lease (below) makes
  # exactly one of them serve at a time.
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: icegres
      app.kubernetes.io/instance: icegres
      app.kubernetes.io/component: icegresd
  template:
    metadata:
      labels:
        helm.sh/chart: icegres-0.1.0
        app.kubernetes.io/name: icegres
        app.kubernetes.io/instance: icegres
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: icegresd
    spec:
      serviceAccountName: icegres
      # The token exists solely for the scale-subresource PATCH.
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread the redundant instances; soft — a one-node dev cluster
      # still schedules, the lease just protects less.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: icegres
                    app.kubernetes.io/instance: icegres
                    app.kubernetes.io/component: icegresd
      containers:
        - name: icegresd
          image: "icegres:0.1.0"
          imagePullPolicy: IfNotPresent
          command: ["/usr/bin/tini", "--", "/usr/local/bin/icegresd"]
          args: ["serve"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          env:
            - name: ICEGRESD_HOST
              value: "0.0.0.0"
            - name: ICEGRESD_PORT
              value: "5432"
            # k8s mode: the main compute is the writer Service, never a
            # forked child (see `icegresd serve --help`).
            - name: ICEGRESD_K8S_COMPUTE
              value: "true"
            - name: ICEGRESD_COMPUTE_HOST
              value: "icegres-writer"
            - name: ICEGRESD_MAIN_PORT
              value: "5439"
            - name: ICEGRESD_WAKE_TIMEOUT_MS
              value: "120000"
            - name: ICEGRESD_STATUS_FILE
              value: /tmp/icegresd-status.json
            # SCRAM computes cannot be pre-handshaked by the proxy: keep
            # the pool off instead of letting every warm attempt fail.
            - name: ICEGRESD_POOL_SIZE
              value: "0"
            - name: ICEGRESD_LEASE_QUORUM
              value: "icegres-lease-0.icegres-lease:5471,icegres-lease-1.icegres-lease:5471,icegres-lease-2.icegres-lease:5471"
            - name: ICEGRESD_LEASE_TTL_MS
              value: "6000"
          ports:
            - name: pgwire
              containerPort: 5432
          livenessProbe:
            tcpSocket:
              port: pgwire
            periodSeconds: 10
          # Leadership readiness: standbys answer 57P03, so they must be
          # OUT of the Service until they hold the lease. The status file
          # is atomically replaced on every leadership flip.
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - "grep -q '\"leader\": true' /tmp/icegresd-status.json"
            periodSeconds: 2
            failureThreshold: 2
          # Drain/eviction of the leader (the PDB deliberately allows it —
          # see icegresd-pdb.yaml): deletion pulls the pod from the Service
          # endpoints at Terminating; the brief preStop keeps the process
          # serving while that propagates (a connection routed here in the
          # same instant still lands on a live leader), then SIGTERM stops
          # lease renewal IMMEDIATELY and the standby takes over within
          # ~1-2x ha.leaseTtlMs. icegresd exits in well under the default
          # 30 s terminationGracePeriodSeconds (k8s mode has no child
          # computes to reap).
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 2"]
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem: the status file needs a writable /tmp.
        - name: tmp
          emptyDir: {}
---
# Source: icegres/templates/keeper-trio.yaml
# Data quorum trio: 2-of-3 fsync before every buffered-write ack (tail.mode=quorum). A replacement writer's tail election fences the old one here.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: icegres-keeper
  namespace: icegres-system
  labels:
    helm.sh/chart: icegres-0.1.0
    app.kubernetes.io/name: icegres
    app.kubernetes.io/instance: icegres
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: keeper
spec:
  # Exactly three: the consensus is 2-of-3 by construction.
  replicas: 3
  serviceName: icegres-keeper
  # Acceptors are independent; start them together.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app.kubernetes.io/name: icegres
      app.kubernetes.io/instance: icegres
      app.kubernetes.io/component: keeper
  template:
    metadata:
      labels:
        helm.sh/chart: icegres-0.1.0
        app.kubernetes.io/name: icegres
        app.kubernetes.io/instance: icegres
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/component: keeper
    spec:
      serviceAccountName: icegres
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 3
          topologyKey: "topology.kubernetes.io/zone"
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: icegres
              app.kubernetes.io/instance: icegres
              app.kubernetes.io/component: keeper
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: "topology.kubernetes.io/zone"
                    operator: Exists
        podAntiAffinity:
          # Two acceptors on one node quietly reduce the 2-of-3 promise
          # to that node's survival: refuse to co-schedule (set
          # keeper.antiAffinity=soft only on dev clusters).
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: icegres
                  app.kubernetes.io/instance: icegres
                  app.kubernetes.io/component: keeper
      containers:
        - name: icekeeperd
          image: "icegres:0.1.0"
          imagePullPolicy: IfNotPresent
          # --node-id from the ordinal in the pod hostname (<name>-0/1/2).
          command: ["/usr/bin/tini", "--", "/bin/sh", "-c"]
          args:
            - >-
              exec /usr/local/bin/icekeeperd serve --host 0.0.0.0
              --port 5471
              --data-dir /var/lib/icekeeper
              --node-id "${HOSTNAME##*-}"
          env:
            - name: ICEKEEPER_MAX_CONNECTIONS
              value: "64"
            - name: ICEKEEPER_MAX_REQUESTS
              value: "16"
            - name: ICEKEEPER_REQUEST_BYTES
              value: "67108864"
            - name: ICEKEEPER_RESPONSE_BYTES
              value: "67108864"
            - name: ICEKEEPER_MAX_READ_BYTES
              value: "8388608"
            - name: ICEKEEPER_IO_TIMEOUT_MS
              value: "30000"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
          ports:
            - name: acceptor
              containerPort: 5471
          livenessProbe:
            tcpSocket:
              port: acceptor
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: acceptor
            periodSeconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/icekeeper
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
